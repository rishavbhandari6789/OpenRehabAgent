[project]
name = "openrehabagent"
version = "0.3.0"
description = "A modular multi-agent research prototype for video-based pain localisation and adaptive exercise recommendation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rishav Bhandari" }]
license = { text = "MIT" }
